<div class="min-h-screen bg-canvas flex flex-col">
  <div class="px-8 py-6">
    <img src="images/logo.png" alt="nibo" class="h-7">
  </div>

  <div class="flex-1 flex justify-center px-6 pt-8">
    <div class="w-full max-w-[420px]">
      <h1 class="text-2xl font-bold text-center m-0">Log in</h1>
      <p class="text-sm text-ink-2 text-center mt-2 mb-8">Welcome to Nibo! Come on in to continue make your products more accessible</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-5">
          <label class="field-label">Email</label>
          <input pInputText type="email" placeholder="Enter your email" formControlName="email" class="w-full" />
        </div>

        <div class="mb-3">
          <label class="field-label">Password</label>
          <p-password formControlName="password" placeholder="Enter your Password" [toggleMask]="true" [feedback]="false"
                      styleClass="w-full" inputStyleClass="w-full" />
        </div>

        <div class="text-[13px] text-ink-2 mb-6">
          Forgot Password? <a routerLink="/forgot-password" class="text-brand font-medium no-underline">Reset</a>
        </div>

        <p-button label="Log in" type="submit" styleClass="w-full" [disabled]="form.invalid" [loading]="loading" />
      </form>

      <p-divider align="center" styleClass="my-6">
        <span class="text-xs text-ink-3">or</span>
      </p-divider>

      <p-button [outlined]="true" severity="secondary" styleClass="w-full" (onClick)="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24" class="mr-2">
          <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.26-2.09 3.57-5.16 3.57-8.81Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.07.72-2.44 1.14-4.07 1.14-3.13 0-5.78-2.11-6.73-4.96H1.29v3.1A12 12 0 0 0 12 24Z"/>
          <path fill="#FBBC05" d="M5.27 14.27A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.55.38-2.27v-3.1H1.29a12 12 0 0 0 0 10.74l3.98-3.1Z"/>
          <path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.58 1.8l3.44-3.44A11.97 11.97 0 0 0 12 0 12 12 0 0 0 1.29 6.63l3.98 3.1C5.22 6.88 8.87 4.77 12 4.77Z"/>
        </svg>
        <span>Log In with Google</span>
      </p-button>

      <p class="text-center text-[13px] text-ink-2 mt-16">
        I don't have an account? <a routerLink="/signup" class="text-brand font-medium no-underline">Create an account</a>
      </p>
    </div>
  </div>
</div>
