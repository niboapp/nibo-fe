<div class="min-h-screen bg-canvas flex flex-col">
  <div class="px-8 py-6">
    <img src="images/logo.png" alt="nibo" class="h-7">
  </div>

  <div class="flex-1 flex justify-center px-6 pt-8">
    <div class="w-full max-w-[420px]">

      <ng-container *ngIf="step === 'email'">
        <h1 class="text-2xl font-bold text-center m-0">Forgot password</h1>
        <p class="text-sm text-ink-2 text-center mt-2 mb-8">Enter your email and we'll send you a 5-digit code to reset your password</p>

        <form [formGroup]="emailForm" (ngSubmit)="sendCode()">
          <div class="mb-6">
            <label class="field-label">Email</label>
            <input pInputText type="email" placeholder="Enter your email" formControlName="email" class="w-full" />
            <small *ngIf="emailInvalid" class="text-danger text-xs block mt-1">Enter a valid email address</small>
          </div>

          <p-button label="Send code" type="submit" styleClass="w-full" [disabled]="emailForm.invalid" />
        </form>
      </ng-container>

      <ng-container *ngIf="step === 'otp'">
        <h1 class="text-2xl font-bold text-center m-0">Check your email</h1>
        <p class="text-sm text-ink-2 text-center mt-2 mb-8">We sent a 5-digit code to <strong>{{ email }}</strong>. Enter it below to continue.</p>

        <div class="flex justify-center mb-8">
          <p-inputotp [(ngModel)]="otp" [length]="5" [integerOnly]="true" />
        </div>

        <p-button label="Verify" styleClass="w-full" [disabled]="otp.length !== 5" (onClick)="verifyCode()" />

        <p class="text-center text-[13px] text-ink-2 mt-6">
          Didn't get a code? <a href="javascript:void(0)" class="text-brand font-medium no-underline" (click)="resendCode()">Resend</a>
        </p>
      </ng-container>

      <p class="text-center text-[13px] text-ink-2 mt-16">
        Remember your password? <a routerLink="/login" class="text-brand font-medium no-underline">Sign in</a>
      </p>
    </div>
  </div>
</div>
