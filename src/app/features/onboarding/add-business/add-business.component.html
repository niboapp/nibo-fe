<div class="min-h-screen bg-canvas flex items-center justify-center px-6 py-12">
  <div class="card p-8 sm:p-10 w-full max-w-[640px] shadow-sm">
    <div class="mb-8">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-light text-brand text-xs font-semibold mb-3">
        <span>Step 1 of 4</span> • <span>Required</span>
      </div>
      <h1 class="text-2xl font-bold text-ink m-0">Add Business Profile</h1>
      <p class="text-sm text-ink-2 mt-1 mb-0">Establish your brand identity so retailers and consumers can discover you</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
      <div>
        <label class="field-label">Business Name <span class="text-danger">*</span></label>
        <input pInputText type="text" placeholder="e.g. Acme Consumer Brands Ltd" formControlName="businessName" class="w-full" />
      </div>

      <div>
        <label class="field-label">Store / Brand Name <span class="text-danger">*</span></label>
        <input pInputText type="text" placeholder="e.g. Acme Store" formControlName="storeName" class="w-full" />
      </div>

      <div>
        <label class="field-label">Business Logo</label>
        <label class="flex flex-col items-center justify-center gap-1 border border-dashed border-line rounded-xl p-6 text-ink-2 text-sm cursor-pointer text-center hover:border-brand transition-colors bg-canvas/40">
          <input type="file" accept="image/jpeg,image/png,image/gif" (change)="onLogoSelected($event)" hidden />
          <img *ngIf="logoPreviewUrl" [src]="logoPreviewUrl" alt="Logo preview" class="max-w-full max-h-[110px] rounded-lg object-cover" />
          <ng-container *ngIf="!logoPreviewUrl">
            <i class="pi pi-upload text-xl text-ink-3"></i>
            <span class="font-medium text-ink">Upload Corporate Logo</span>
            <span class="text-xs text-ink-3">Supported formats: JPG, PNG, GIF (Max 5MB)</span>
          </ng-container>
          <span *ngIf="logoPreviewUrl" class="text-xs text-brand font-medium mt-1">Change Logo</span>
        </label>
      </div>

      <div>
        <label class="field-label">Headquarters / Business Address <span class="text-danger">*</span></label>
        <input pInputText type="text" placeholder="e.g. 14 Victoria Island, Lagos" formControlName="location" class="w-full" />
      </div>

      <div>
        <label class="field-label">Industry Vertical <span class="text-danger">*</span></label>
        <p-select [options]="industries" formControlName="industry" placeholder="Select your industry" styleClass="w-full" />
      </div>

      <div class="mt-4 pt-4 border-t border-line">
        <p-button label="Save & Continue to Onboarding" type="submit" [loading]="loading" styleClass="w-full" icon="pi pi-arrow-right" iconPos="right" />
      </div>
    </form>
  </div>
</div>
