<app-page-header [title]="isEditMode ? 'Edit Product' : 'Add New Product'"
  [subtitle]="isEditMode ? form.get('name')?.value : 'Fill in the product details below'" [showBack]="true"
  (back)="goBack()"></app-page-header>

<div class="card p-8" *ngIf="fetching">
  <div class="grid grid-cols-[1fr_auto_1fr] gap-8">
    <div class="flex flex-col gap-5">
      <p-skeleton height="2.75rem" />
      <p-skeleton height="9rem" />
      <p-skeleton height="5rem" />
      <p-skeleton height="2.75rem" />
    </div>
    <div class="w-px bg-line"></div>
    <div class="flex flex-col gap-5">
      <p-skeleton *ngFor="let _ of [1,2,3,4,5]" height="2.75rem" />
    </div>
  </div>
</div>

<form *ngIf="!fetching" class="card p-8" [formGroup]="form" (ngSubmit)="submit()">
  <div class="grid grid-cols-[1fr_auto_1fr] gap-8">
    <div class="flex flex-col gap-5">
      <div>
        <label class="field-label">Product Name</label>
        <div class="relative flex items-center">
          <input pInputText type="text" placeholder="Enter product name" formControlName="name" class="w-full"
            [class.!border-danger]="isInvalid('name')" [class.pr-20]="isInvalid('name')" />
          <span *ngIf="getFieldError('name') as err"
            class="absolute right-3 text-xs text-danger font-medium pointer-events-none bg-surface/90 px-1">
            {{ err }}
          </span>
        </div>
      </div>

      <div>
        <label class="field-label">Product Image</label>
        <label style="border: 1px solid #cbd5e1 !important;"
          class="relative flex flex-col items-center justify-center gap-1 border border-dashed border-line rounded-xl p-8 text-ink-2 text-sm cursor-pointer text-center">
          <input type="file" accept="image/jpeg,image/png,image/gif" (change)="onFileSelected($event)" hidden />
          <img *ngIf="imagePreviewUrl" [src]="imagePreviewUrl" alt="Preview"
            class="max-w-full max-h-[140px] rounded-lg object-cover" />
          <ng-container *ngIf="!imagePreviewUrl">
            <i class="pi pi-upload text-xl"></i>
            <span>Image Upload</span>
            <span class="text-xs text-ink-3">Supported formats: JPG, PNG, GIF</span>
          </ng-container>
          <span *ngIf="imagePreviewUrl" class="absolute bottom-2 text-xs text-brand font-medium">{{ isEditMode ? 'Edit
            Image' : 'Change Image' }}</span>
        </label>
      </div>

      <div class="relative">
        <label class="field-label">Product Description</label>
        <textarea pTextarea placeholder="Enter product description" formControlName="description" maxlength="300"
          rows="4" class="w-full resize-y" [class.!border-danger]="isInvalid('description')"></textarea>
        <span class="absolute right-2.5 bottom-2 text-[11px] text-ink-3">{{ descriptionLength }}/300</span>
        <small class="text-xs text-danger mt-1 block" *ngIf="isInvalid('description')">
          Product description is required
        </small>
      </div>

      <div>
        <label class="field-label">Retail Price</label>
        <p-inputnumber formControlName="retailPrice" placeholder="Enter retail price" [min]="0" styleClass="w-full"
          inputStyleClass="w-full" />
        <small class="text-xs text-danger mt-1 block" *ngIf="isInvalid('retailPrice')">
          Retail price is required
        </small>
      </div>
    </div>

    <div class="w-px bg-line"></div>

    <div class="flex flex-col gap-5">
      <div>
        <label class="field-label">Quantity</label>
        <p-inputnumber formControlName="quantity" placeholder="Enter quantity" [min]="1" styleClass="w-full"
          inputStyleClass="w-full" />
        <small class="text-xs text-danger mt-1 block" *ngIf="isInvalid('quantity')">
          Quantity is required (min 1)
        </small>
      </div>

      <div>
        <label class="field-label">Barcode</label>
        <div class="relative flex items-center">
          <input pInputText type="number" placeholder="Enter barcode number" inputmode="numeric"
            formControlName="barcode" class="w-full" [class.!border-danger]="isInvalid('barcode')"
            [class.pr-28]="isInvalid('barcode')" />
          <span *ngIf="getFieldError('barcode') as err"
            class="absolute right-3 text-xs text-danger font-medium pointer-events-none bg-surface/90 px-1">
            {{ err }}
          </span>
        </div>
      </div>

      <div>
        <label class="field-label">Batch Number</label>
        <div class="relative flex items-center">
          <input pInputText type="text" placeholder="Enter batch number (e.g. BN-2026-01)" formControlName="batchNumber"
            class="w-full" [class.!border-danger]="isInvalid('batchNumber')" [class.pr-32]="isInvalid('batchNumber')" />
          <span *ngIf="getFieldError('batchNumber') as err"
            class="absolute right-3 text-xs text-danger font-medium pointer-events-none bg-surface/90 px-1">
            {{ err }}
          </span>
        </div>
      </div>

      <div>
        <label class="field-label">Manufacturing Date</label>
        <p-datepicker formControlName="manufacturingDate" placeholder="Select manufacturing date" dataType="string"
          dateFormat="yy-mm-dd" styleClass="w-full" inputStyleClass="w-full" [showIcon]="true" />
        <small class="text-xs text-danger mt-1 block" *ngIf="isInvalid('manufacturingDate')">
          Manufacturing date is required
        </small>
      </div>

      <div>
        <label class="field-label">Expiring Date</label>
        <p-datepicker formControlName="expiringDate" placeholder="Select expiring date" dataType="string"
          dateFormat="yy-mm-dd" styleClass="w-full" inputStyleClass="w-full" [showIcon]="true" />
        <small class="text-xs text-danger mt-1 block" *ngIf="isInvalid('expiringDate')">
          Expiring date is required
        </small>
      </div>
    </div>
  </div>

  <div class="flex justify-end gap-3 mt-8">
    <p-button label="Cancel" [outlined]="true" (onClick)="goBack()" />
    <p-button [label]="isEditMode ? 'Update Product' : 'Add Product'" type="submit" [loading]="loading"
      [disabled]="form.invalid || loading" />
  </div>
</form>
